<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EconSim — симулятор стран мира</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="globe"></div>
  <div id="vignette"></div>

  <!-- верх: бренд + ключевые показатели мира -->
  <header id="topbar">
    <div class="brand"><span class="logo">◍</span><span>EconSim</span><span class="ver">мир · 197 стран</span></div>
    <div id="kpis"></div>
  </header>

  <!-- левая навигация -->
  <nav id="rail">
    <button data-tab="scen" class="on" title="Готовые сценарии"><span class="ic">🎬</span><span>Сценарии</span></button>
    <button data-tab="prompt" title="Событие обычной фразой"><span class="ic">✍️</span><span>Промт</span></button>
    <button data-tab="build" title="Собрать свой сценарий"><span class="ic">🧩</span><span>Конструктор</span></button>
    <button data-tab="mkt" title="Рынки, валюты, крипта, корпорации"><span class="ic">📈</span><span>Рынки</span></button>
    <button data-tab="src" title="Данные и модель"><span class="ic">🗂</span><span>Данные</span></button>
  </nav>
  <aside id="left" class="panel">
    <div class="ph"><b id="left-title">Сценарии</b><button class="icon" id="left-close" title="Свернуть">⟨</button></div>
    <section id="tab-scen" class="tab on"></section>
    <section id="tab-prompt" class="tab"></section>
    <section id="tab-build" class="tab"></section>
    <section id="tab-mkt" class="tab"></section>
    <section id="tab-src" class="tab"></section>
  </aside>

  <!-- правый инспектор: мир или страна -->
  <aside id="right" class="panel"></aside>

  <!-- выбор метрики + легенда -->
  <div id="mapkey" class="panel">
    <button id="metric-btn"><span class="mk-dot"></span><span id="lg-title">Рост ВВП</span><span class="chev">▾</span></button>
    <div class="lg-bar" id="lg-bar"></div><div class="lg-lbl"><span id="lg-min"></span><span id="lg-max"></span></div>
    <div id="metric-menu"></div>
  </div>

  <!-- нижний док: время + новости -->
  <section id="dock" class="panel">
    <div class="dock-row">
      <button id="btn-reset" class="icon" title="Начать заново">⟲</button>
      <button id="btn-play" class="play" title="Пуск / пауза (пробел)">▶</button>
      <button id="btn-step" class="icon" title="Один месяц вперёд">⏭</button>
      <div class="speed" id="speed">
        <button data-v="0.5">½</button><button data-v="1" class="on">1</button><button data-v="2">2</button><button data-v="4">4</button><button data-v="10">10</button><button data-v="24">24</button>
        <span class="unit">мес/с</span>
      </div>
      <div class="date" id="date">—</div>
      <div class="timeline" id="timeline"><div class="tl-fill" id="tl-fill"></div><div id="tl-marks"></div><div class="tl-years" id="tl-years"></div></div>
    </div>
    <div class="ticker">
      <div id="ticker-list"></div>
      <label class="minor"><input type="checkbox" id="feed-minor" /> мелкие</label>
      <button class="icon" id="feed-toggle" title="Вся лента">☰</button>
    </div>
    <div id="feed"><div id="feed-list"></div></div>
  </section>

  <div id="tooltip"></div>
  <div id="toast"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
